<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Throwaway compact popover IA prototype</title>
  <!-- THROWAWAY PROTOTYPE: four compact-popover IA variants, switchable with ?variant=A/B/C/D. -->
  <style>
    :root{color-scheme:light dark;--bg:#f4f2ed;--panel:#fff;--ink:#17211d;--muted:#647069;--line:#d9ded9;--accent:#16624c;--accent2:#d9eee5;--warn:#8a5b00;--bad:#9b3232;--shadow:0 18px 60px #10251b2b;font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#dce5df,#ece8df);color:var(--ink);min-height:100vh;padding:20px 0 90px} button{font:inherit;color:inherit} button:focus-visible{outline:3px solid #2e78d2;outline-offset:2px}
    .popover{width:436px;min-height:620px;max-height:760px;overflow:auto;margin:auto;background:var(--panel);border:1px solid #bfc9c1;border-radius:18px;box-shadow:var(--shadow)}
    header{padding:15px 16px 11px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 94%,transparent);z-index:4} .sticky{position:sticky;top:0}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)} h1,h2,h3,p{margin:0}h1{font-size:17px;margin-top:2px}.sub{font-size:11px;color:var(--muted);margin-top:3px}.prototype-mark{border:1px dashed var(--warn);color:var(--warn);padding:3px 6px;border-radius:5px;font-size:9px;font-weight:800;float:right}
    .filters{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}.filter-row{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start;margin:5px 0}.filter-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:6px}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip,.seg button,.tabbar button,.metric-tabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 8px;cursor:pointer}.chip[aria-pressed=true],.seg button[aria-pressed=true],.tabbar button[aria-selected=true],.metric-tabs button[aria-selected=true]{border-color:var(--accent);background:var(--accent2);color:var(--accent);font-weight:700}.chip[aria-pressed=true]::before{content:"✓ ";font-weight:900}.logic{font-size:10px;color:var(--muted);padding:2px 0 0 60px}
    main{padding:12px 14px 18px}.section{margin-bottom:14px}.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px}.section h2{font-size:12px;letter-spacing:.02em}.window{font:600 10px ui-monospace,SFMono-Regular,monospace;color:var(--muted)}
    .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.kpi{border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--panel)}.kpi strong{display:block;font-size:17px;margin:3px 0}.kpi small{display:block;color:var(--muted);font-size:9px}.delta{font-size:10px;color:var(--accent)}
    .meta3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}.meta{border-left:3px solid var(--line);padding:4px 5px;background:#f5f6f4;border-radius:3px;font-size:9px}.meta b{display:block;font-size:8px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}.meta.quality{border-left-style:double;border-left-color:#536d94}.meta.state{border-left-color:var(--warn)}.meta.coverage{border-left-color:var(--accent)}
    .seg,.tabbar,.metric-tabs{display:flex;gap:4px}.seg button,.tabbar button,.metric-tabs button{font-size:10px}.range-line{display:grid;grid-template-columns:80px 1fr 42px;gap:7px;align-items:center;margin:7px 0}.track{height:7px;border-radius:8px;background:#e1e5e1;position:relative}.track::after{content:"";position:absolute;left:22%;right:18%;top:0;bottom:0;border-radius:8px;background:repeating-linear-gradient(90deg,var(--accent),var(--accent) 5px,#5eaa8f 5px,#5eaa8f 8px)}.low-n{border:1px dashed var(--warn);border-radius:8px;padding:7px;background:#fff9e9;color:#59420f;font-size:10px}.low-n::before{content:"△ ";font-weight:900}
    .chart{height:94px;border:1px solid var(--line);border-radius:10px;padding:8px;background:linear-gradient(to bottom,transparent 23%,#dfe4df 24%,transparent 25%,transparent 49%,#dfe4df 50%,transparent 51%,transparent 74%,#dfe4df 75%,transparent 76%);display:flex;align-items:flex-end;gap:5px}.bar{flex:1;border:1px solid #115642;background:repeating-linear-gradient(135deg,#68b595,#68b595 4px,#bde4d3 4px,#bde4d3 8px);border-radius:3px 3px 0 0}.bar.partial{border-style:dashed;background:repeating-linear-gradient(135deg,#c0a05d,#c0a05d 3px,#f2dfb3 3px,#f2dfb3 7px)}.chart-key{font-size:9px;color:var(--muted);margin-top:4px}.table-link{border:0;background:none;color:var(--accent);text-decoration:underline;padding:0;cursor:pointer}
    .rank{display:grid;grid-template-columns:75px 1fr 44px;gap:6px;align-items:center;margin:5px 0;font-size:10px}.rank i{height:6px;background:var(--accent);border-radius:3px}.rank.other i{background:repeating-linear-gradient(90deg,#68736d,#68736d 4px,#c9cfcb 4px,#c9cfcb 7px)}
    .switcher{position:fixed;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:9px;background:#121a17;color:white;border-radius:999px;padding:7px 9px;box-shadow:0 8px 32px #0008}.switcher button{width:28px;height:28px;border:1px solid #62706a;background:#26312d;color:#fff;border-radius:50%;cursor:pointer}.switcher b{min-width:168px;text-align:center;font-size:11px}.switcher small{display:block;color:#b9c5bf;font-weight:400}
    .tabs-shell .tabbar{padding:10px 14px 0}.tabs-shell .tabbar button{flex:1;border-radius:7px}.tab-panel[hidden]{display:none}
    .rail-shell{display:grid;grid-template-columns:126px 1fr;min-height:560px}.rail-shell aside{border-right:1px solid var(--line);padding:11px 9px;background:#f6f7f5}.rail-shell aside .chip{width:100%;text-align:left;margin:2px 0}.rail-shell aside .filter-label{margin-top:9px}.rail-shell main{padding:11px 10px}.rail-shell .kpis{grid-template-columns:1fr}.rail-shell .meta3{grid-template-columns:1fr}.rail-shell .chart{height:82px}.rail-shell .logic{padding:6px 0}
    .drill-home .hero{padding:18px 14px;text-align:center;border-bottom:1px solid var(--line)}.pulse{font-size:38px;font-weight:800;letter-spacing:-.04em}.drill-button{width:100%;display:grid;grid-template-columns:1fr auto;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel);padding:12px;margin:7px 0;border-radius:10px;cursor:pointer}.drill-button strong{display:block}.drill-button span{color:var(--muted);font-size:10px}.drill-button::after{content:"›";font-size:22px}.back{border:0;background:none;color:var(--accent);padding:0 0 10px;cursor:pointer}.back::before{content:"← "}.note{font-size:10px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
    .visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.empty{padding:18px;border:1px dashed var(--line);border-radius:10px;text-align:center;color:var(--muted)}
    @media(max-width:470px){body{padding-top:0}.popover{width:100%;border-radius:0;max-height:none}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div id="app" class="popover" aria-label="Synthetic coding-agent metrics popover"></div>
  <nav class="switcher" aria-label="Prototype variant switcher">
    <button id="prev" aria-label="Previous variant">←</button><b id="variantLabel"></b><button id="next" aria-label="Next variant">→</button>
  </nav>
  <script>
  const variants={A:'Single scroll',B:'Purpose tabs',C:'Filter rail',D:'Summary drill-down'};
  const state={variant:new URLSearchParams(location.search).get('variant')?.toUpperCase()||'A',agents:['All'],models:['All'],scope:'Overall',range:'24h',metric:'Throughput',tab:'Overview',detail:null};
  if(!variants[state.variant]) state.variant='A';
  const agents=['All','Codex','Claude Code'],models=['All','Orion 2','Nova Large','Sage Mini','Atlas Code','Ember','Quartz'];
  const header=()=>`<header class="sticky"><span class="prototype-mark">THROWAWAY · SYNTHETIC</span><span class="eyebrow">Coding Agent Metrics</span><h1>Live activity</h1><p class="sub">Updated 8s ago · selected filters use group OR, axes use AND</p></header>`;
  function chipGroup(axis,values,selected,vertical=false){return `<div class="${vertical?'':'chips'}" role="group" aria-label="${axis} multi-select">${values.map(v=>`<button class="chip" data-axis="${axis}" data-value="${v}" aria-pressed="${selected.includes(v)}">${v}</button>`).join('')}</div>`}
  const filters=(vertical=false)=>vertical?`<aside><div class="filter-label">Agent</div>${chipGroup('agents',agents,state.agents,true)}<div class="filter-label">Model</div>${chipGroup('models',models,state.models,true)}<p class="logic">Within OR<br>Across AND</p></aside>`:`<section class="filters"><div class="filter-row"><span class="filter-label">Agent</span>${chipGroup('agents',agents,state.agents)}</div><div class="filter-row"><span class="filter-label">Model</span>${chipGroup('models',models,state.models)}</div><p class="logic">All = no restriction · multi-select is allowed on both axes</p></section>`;
  const meta=()=>`<div class="meta3" aria-label="Metric provenance"><div class="meta quality"><b>Quality</b>◇ Derived</div><div class="meta state"><b>State</b>◷ Stale 2m</div><div class="meta coverage"><b>Coverage</b>◑ Partial 91%</div></div>`;
  const kpis=()=>`<section class="section"><div class="section-head"><h2>Fixed live windows</h2><span class="window">auto-refresh</span></div><div class="kpis"><article class="kpi"><small>Output throughput · 30s</small><strong>482 <small>tok/s</small></strong><span class="delta">↑ 8%</span></article><article class="kpi"><small>Token burn · 5m</small><strong>74.2k</strong><span class="delta">input + output / min</span></article><article class="kpi"><small>Model calls · 15m</small><strong>126</strong><span class="delta">8.4 / min</span></article></div>${meta()}</section>`;
  function performance(){const rows=state.scope==='Overall'?`<div class="range-line"><span>Decode TPS</span><div class="track" aria-label="p25 44, median 61, p75 78"></div><b>61</b></div><div class="range-line"><span>First output</span><div class="track" aria-label="p25 0.7s, median 1.2s, p75 2.1s"></div><b>1.2s</b></div>`:`<div class="range-line"><span>Orion 2</span><div class="track" aria-label="Orion 2 Decode TPS p25 58, median 72, p75 86"></div><b>72</b></div><div class="range-line"><span>Nova Large</span><div class="track" aria-label="Nova Large Decode TPS p25 45, median 59, p75 74"></div><b>59</b></div><div class="range-line"><span>Atlas Code</span><div class="track" aria-label="Atlas Code Decode TPS p25 39, median 53, p75 66"></div><b>53</b></div>`;return `<section class="section"><div class="section-head"><h2>Per-call performance</h2><div class="seg" aria-label="Independent performance range">${['1h','24h','7d'].map(x=>`<button data-range="${x}" aria-pressed="${state.range===x}">${x}</button>`).join('')}</div></div><div class="seg" aria-label="Performance grouping"><button data-scope="Overall" aria-pressed="${state.scope==='Overall'}">Overall</button><button data-scope="By model" aria-pressed="${state.scope==='By model'}">By model</button></div>${rows}<div class="low-n"><b>Low n: Sage Mini · n=2.</b> Showing observed values 47, 52; percentiles withheld.</div><p class="chart-key">${state.scope==='By model'?'Decode TPS distributions by model':'Overall Decode TPS and first-output distributions'} · formula v1 · excludes time to first token · selected range: ${state.range}</p></section>`}
  const trends=()=>`<section class="section"><div class="section-head"><h2>Trend</h2><div class="metric-tabs" role="tablist">${['Throughput','Burn','Calls'].map(x=>`<button role="tab" data-metric="${x}" aria-selected="${state.metric===x}">${x}</button>`).join('')}</div></div><div class="chart" role="img" aria-label="${state.metric} synthetic trend: partial coverage on the final two intervals"><i class="bar" style="height:31%"></i><i class="bar" style="height:47%"></i><i class="bar" style="height:42%"></i><i class="bar" style="height:71%"></i><i class="bar" style="height:63%"></i><i class="bar" style="height:84%"></i><i class="bar partial" style="height:58%"></i><i class="bar partial" style="height:66%"></i></div><p class="chart-key">Solid = complete · hatched/dashed = partial · <button class="table-link" aria-expanded="false">show data table</button></p></section>`;
  const ranking=()=>`<section class="section"><div class="section-head"><h2>By model</h2><span class="window">Top 4 by selected metric</span></div>${[['Orion 2',100,'482'],['Nova Large',83,'401'],['Atlas Code',72,'347'],['Sage Mini',49,'236'],['Other · 2',31,'149']].map((r,i)=>`<div class="rank ${i===4?'other':''}"><span>${r[0]}</span><i style="width:${r[1]}%"></i><b>${r[2]}</b></div>`).join('')}<p class="chart-key">Other is an explicit aggregate; fixed alphabetical tie-break prevents rank jitter.</p></section>`;
  const allContent=()=>`${kpis()}${performance()}${trends()}${ranking()}<p class="note">Unavailable is shown as “— unavailable”, never as zero. Synthetic fixture only.</p>`;
  function renderA(){return `${header()}${filters()}<main>${allContent()}</main>`}
  function renderB(){const panels={Overview:`${kpis()}${meta()}${ranking()}`,Performance:performance(),Trends:`${trends()}${ranking()}`};return `<div class="tabs-shell">${header()}${filters()}<div class="tabbar" role="tablist">${Object.keys(panels).map(x=>`<button role="tab" data-tab="${x}" aria-selected="${state.tab===x}">${x}</button>`).join('')}</div><main><section class="tab-panel">${panels[state.tab]}</section><p class="note">Shared filters persist across purpose-based views.</p></main></div>`}
  function renderC(){return `${header()}<div class="rail-shell">${filters(true)}<main>${kpis()}${performance()}${trends()}${ranking()}</main></div>`}
  function detail(name){if(name==='Live KPIs')return `${kpis()}${trends()}`;if(name==='Performance')return `${performance()}${ranking()}`;return `${trends()}${ranking()}${meta()}`}
  function renderD(){if(state.detail)return `${header()}${filters()}<main><button class="back" data-back>Summary</button><h2>${state.detail}</h2>${detail(state.detail)}</main>`;return `${header()}${filters()}<div class="drill-home"><div class="hero"><span class="eyebrow">30s output throughput</span><div class="pulse">482</div><p>tok/s · ◇ derived · ◑ partial</p></div><main><button class="drill-button" data-detail="Live KPIs"><span><strong>Live KPIs</strong>Fixed 30s / 5m / 15m windows</span></button><button class="drill-button" data-detail="Performance"><span><strong>Performance</strong>${state.range} range · low-n-safe distributions</span></button><button class="drill-button" data-detail="Trends & models"><span><strong>Trends & models</strong>${state.metric} · Top 4 + Other</span></button><p class="note">Minimal summary first; each row opens a focused detail view.</p></main></div>`}
  function render(){document.getElementById('app').innerHTML=({A:renderA,B:renderB,C:renderC,D:renderD})[state.variant]();document.getElementById('variantLabel').innerHTML=`${state.variant} — ${variants[state.variant]}<small>?variant=${state.variant} · ← / → to compare</small>`;bind()}
  function cycle(delta){const keys=Object.keys(variants),i=keys.indexOf(state.variant);state.variant=keys[(i+delta+keys.length)%keys.length];const u=new URL(location);u.searchParams.set('variant',state.variant);history.replaceState({},'',u);state.detail=null;render()}
  function toggle(axis,value){let a=state[axis];if(value==='All'){state[axis]=['All']}else{a=a.filter(x=>x!=='All');a=a.includes(value)?a.filter(x=>x!==value):[...a,value];state[axis]=a.length?a:['All']}render()}
  function bind(){document.querySelectorAll('[data-axis]').forEach(b=>b.onclick=()=>toggle(b.dataset.axis,b.dataset.value));document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{state.range=b.dataset.range;render()});document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{state.scope=b.dataset.scope;render()});document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{state.metric=b.dataset.metric;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{state.detail=b.dataset.detail;render()});document.querySelector('[data-back]')?.addEventListener('click',()=>{state.detail=null;render()});document.querySelectorAll('.table-link').forEach(b=>b.onclick=()=>{b.setAttribute('aria-expanded','true');b.outerHTML='<span role="status">30s: 366, 401, 389, 472; final two intervals partial.</span>'})}
  document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
  </script>
</body>
</html>
